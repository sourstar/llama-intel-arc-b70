# Repeat sweep. The first pass put deployed, ub4096, np2 and onednn-maxkv
# inside 4% of each other, which is smaller than the run-to-run spread measured
# during the soak (stdev 184 tok/s on a mean of 2202, ~8%). One sample each
# cannot separate them, so each configuration is measured three times, in a
# fresh container, interleaved rather than grouped — so that thermal drift over
# the run hits every configuration equally instead of penalising whichever went
# last.
#
#   name              CTX     NP   UB     FA   EXTRA

deployed-r1          32768   4    8192   on   -
ub4096-r1            32768   4    4096   on   -
np2-r1               16384   2    2048   on   -
maxkv-r1             32768   4    8192   on   env:GGML_SYCL_FA_ONEDNN_MAX_KV=8192

deployed-r2          32768   4    8192   on   -
ub4096-r2            32768   4    4096   on   -
np2-r2               16384   2    2048   on   -
maxkv-r2             32768   4    8192   on   env:GGML_SYCL_FA_ONEDNN_MAX_KV=8192

deployed-r3          32768   4    8192   on   -
ub4096-r3            32768   4    4096   on   -
np2-r3               16384   2    2048   on   -
maxkv-r3             32768   4    8192   on   env:GGML_SYCL_FA_ONEDNN_MAX_KV=8192
