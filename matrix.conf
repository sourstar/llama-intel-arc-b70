# Configurations to sweep. Consistency is checked first for every one of them;
# throughput is only measured for the ones that pass.
#
#   name              CTX     NP   UB     FA   EXTRA
#
# EXTRA is either extra llama-server flags, `env:VAR=VAL` for a docker -e
# setting, or `-` for nothing.
#
# TWO SEPARATE QUESTIONS, and the original version of this file confused them:
#
#   Per-slot context (CTX / NP) is a CAPACITY limit. gutenberg.toml declares
#   `ctx = 8192`, so a chunk of up to 8192 tokens is policy-legal and the
#   server must be able to hold one. Shrinking per-slot context to buy more
#   slots would truncate such a chunk. The gate pool's 7900-token chunk means
#   any config that cannot hold one fails consistency and is never benchmarked
#   — which is the point, and two configurations below exist to demonstrate it.
#
#   UB is NOT a capacity limit. Qwen3-Embedding is causal with last-token
#   pooling, so a prompt splits across ubatches and comes back bit-identical
#   (measured: cosine 1.000000 at 7901 tokens, -ub 8192 vs 2048). Lowering it
#   costs no capacity at all.
#
# What the corpus actually contains, for context: mean chunk 926 tokens, and
# 0 of 12,784 documents have a mean above 1000 — in any of 40+ languages, zh
# and ja included. The policy ceiling is 8x what the chunker emits today. That
# is headroom to preserve, not headroom to spend.

# ---- the yardstick -------------------------------------------------------
deployed             32768   4    8192   on   -

# ---- UB sweep, per-slot context held at the policy ceiling of 8192 -------
# All four hold 4 slots x 8192. Only the ubatch changes, so any difference is
# attributable to it alone.
ub4096               32768   4    4096   on   -
ub2048               32768   4    2048   on   -
ub1024               32768   4    1024   on   -
ub512                32768   4    512    on   -

# ---- concurrency, still 8192 per slot ------------------------------------
# More slots means proportionally more KV. np8 needs 65536 of context, which
# is ~9.2 GiB of f16 KV on top of 4.7 GiB of weights.
np2-slot8192         16384   2    2048   on   -
np8-slot8192         65536   8    2048   on   -

# ---- policy violations, included as evidence that the gate catches them ---
# 1024 tokens per slot is plenty for every chunk the corpus contains today,
# and cannot hold a policy-legal one. Expected: consistency FAILS on the
# 7900-token gate chunk, and no throughput number is produced.
np16-slot1024        16384   16   1024   on   -
np32-slot1024        32768   32   1024   on   -

# ---- isolating the sub-1024-token non-determinism ------------------------
# If -fa off comes back bit-identical on the 512-token chunks, that pins the
# drift to the oneDNN SDPA path rather than to something more general.
fa-off               32768   4    8192   off  -

# ---- the upstream escape hatch, costed before it is needed ---------------
onednn-maxkv-8192    32768   4    8192   on   env:GGML_SYCL_FA_ONEDNN_MAX_KV=8192
