services:
  llama-embed:
    command: >-
      -m /models/Qwen3-Embedding-8B-Q4_K_M.gguf --embeddings --pooling last -ngl
      999 -c 32768 -np 4 -b 8192 -ub 8192 -fa on -t 6 --metrics --host 0.0.0.0
      --port 8080
    devices:
      - /dev/dri
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 180s
      test:
        - CMD
        - curl
        - '-fsS'
        - http://localhost:8080/health
      timeout: 5s
    image: ghcr.io/ggml-org/llama.cpp:server-intel-b10630
    ports:
      - '30436:8080'
    restart: unless-stopped
    volumes:
      - /mnt/ssd5/apps/llama-embed:/models